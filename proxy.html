<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>极光引擎</title>
    <base href="https://cdn.jsdelivr.net/gh/t416454999/George@main/">
    <link rel="stylesheet" href="极光样式.css">
</head>
<body>
    <nav class="导航栏" id="导航栏">
        <div class="导航容器">
            <a href="#首页" class="网站标志" onclick="切换页面('首页')">
                <span class="标志标记"></span>
                极光引擎
            </a>
            <div class="导航菜单" id="导航菜单">
                <a href="#首页" class="导航链接 活跃" onclick="切换页面('首页')" data-page="首页">首页</a>
                <a href="#分类" class="导航链接" onclick="切换页面('分类')" data-page="分类">分类</a>
                <a href="#搜索" class="导航链接" onclick="切换页面('搜索')" data-page="搜索">搜索</a>
                <a href="#关于" class="导航链接" onclick="切换页面('关于')" data-page="关于">关于</a>
            </div>
            <button class="菜单按钮" onclick="切换移动菜单()"><span></span><span></span><span></span></button>
        </div>
    </nav>
    <main class="主内容" id="主内容">
        <section id="首页视图" class="页面视图 活跃视图">
            <header class="标题区域"><h1 class="主标题">极光引擎</h1><p class="副标题">安静的AI观察。每日追踪人工智能前沿，一手资讯与深度分析。</p></header>
            <div class="统计条"><div class="统计项"><span class="统计数字" id="文章总数">0</span><span class="统计标签">篇文章</span></div><div class="统计项"><span class="统计数字" id="今日新增">0</span><span class="统计标签">今日新增</span></div><div class="统计项"><span class="统计数字" id="覆盖来源">0</span><span class="统计标签">个来源</span></div></div>
            <div class="筛选栏"><div class="分类标签组" id="分类标签组"></div><select class="排序下拉" onchange="切换排序(this.value)"><option value="最新">最新优先</option><option value="最热">热度优先</option></select></div>
            <div class="文章区域" id="文章区域"><div id="特征容器"></div><div id="一手容器"></div><div id="工具容器"></div><div id="列表容器"></div></div>
            <div class="加载区域"><button class="加载更多按钮" id="加载更多按钮">已加载全部</button></div>
            <div class="空状态" id="空状态" style="display:none;"><p>暂无匹配的文章</p></div>
        </section>
        <section id="分类视图" class="页面视图"><h2 class="页面标题">分类浏览</h2><div class="分类网格" id="分类网格"></div></section>
        <section id="搜索视图" class="页面视图"><h2 class="页面标题">搜索资讯</h2><div class="搜索区域"><div class="搜索输入组"><input type="text" class="搜索输入框" id="搜索输入框" placeholder="输入关键词搜索..." oninput="实时搜索()"><button class="搜索按钮" onclick="执行搜索()">搜索</button></div><div class="搜索建议" id="搜索建议"></div></div><div class="搜索结果" id="搜索结果"><p class="搜索提示">输入关键词开始搜索</p></div></section>
        <section id="详情视图" class="页面视图"><div class="详情容器" id="详情容器"></div></section>
        <section id="关于视图" class="页面视图"><div class="关于容器"><h2 class="页面标题">关于极光引擎</h2><div class="关于内容"><section><h3>这是什么</h3><p><strong>极光引擎</strong> 是一个安静的 AI 观察站。</p></section><section><h3>内容标准</h3><ul><li>优先一手来源：论文原文、官方博客、独家访谈</li><li>每日自动采集 + 人工精选前沿内容</li><li>中英双语：中文标题导读，保留英文原文语境</li></ul></section></div></div></section>
    </main>
    <footer class="页脚"><div class="页脚容器"><div class="页脚信息"><span class="页脚标志">极光引擎</span><span class="页脚分割">·</span><span>每日AI观察</span><span class="页脚分割">·</span><span id="更新时间">更新于：加载中...</span></div><div class="页脚链接"><a href="https://github.com" target="_blank">GitHub Pages</a></div></div></footer>
    <button class="返回顶部" id="返回顶部" onclick="滚动到顶部()">&uarr;</button>
    <script src="极光脚本.js"></script>
</body>
</html>
