# 极光引擎 · HN 热点采集 + Google 翻译
# GitHub Actions 美国服务器，每 5 分钟抓取 HN 并翻译为中文

name: "HN Translate - Hacker News Chinese"

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aurora-cloud-content-update
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.11'

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
        with:
          fetch-depth: 1

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install deps
        run: pip install requests -q

      - name: Fetch HN + Google Translate
        run: python3 .github/workflows/hn-translate-fetch.py

      - name: Commit
        run: |
          git config user.name "HN Translate Bot"
          git config user.email "hn-translate@aurora-engine"
          git add hn-translated.json
          if git diff --staged --quiet; then
            echo "No new data"
          else
            git commit -m "HN: $(date '+%Y-%m-%d %H:%M')"
            if ! git pull --rebase --autostash origin main; then
              echo "::error::HN 更新与 main 发生冲突，已停止推送，请人工合并"
              git rebase --abort || true
              exit 1
            fi
            git push
          fi
