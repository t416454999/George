# 极光引擎 · 境外金融热点采集
# 运行在 GitHub Actions（美国服务器），每 15 分钟抓取一次。
# Bloomberg / Reuters / CNBC / Yahoo Finance / MarketWatch
# 推送结果到 GitHub → 阿里云服务器自动拉取合并

name: "Finance Global - Foreign News Collector"

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.11'

jobs:
  fetch-foreign-finance:
    name: "Fetch foreign financial news"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install requests lxml feedparser -q

      - name: Fetch foreign financial news
        run: python3 .github/workflows/finance-global-fetch.py

      - name: Commit and push
        run: |
          git config user.name "Finance Global Bot"
          git config user.email "finance-global@aurora-engine"
          git add 金融API-国外.json
          if git diff --staged --quiet; then
            echo "No new foreign data"
          else
            git commit -m "Auto: foreign financial news $(date '+%Y-%m-%d %H:%M')"
            git pull --rebase origin main
            git push
            echo "Foreign data updated"
          fi
