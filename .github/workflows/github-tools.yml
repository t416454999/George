# 极光引擎 · GitHub AI 工具排行自动更新
# 每日 UTC 8:00 (北京时间 16:00) 更新一次
# 输出 GitHub工具排行.json

name: "GitHub Tools - 工具排行"

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aurora-cloud-content-update
  cancel-in-progress: false

jobs:
  fetch-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
        with:
          fetch-depth: 1

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install beautifulsoup4

      - name: Fetch GitHub tool rankings
        run: python3 tools/fetch-github-tools.py
        continue-on-error: true

      - name: Commit and push
        run: |
          git config user.name "GitHub Tools Bot"
          git config user.email "tools-bot@aurora-engine"
          git add GitHub工具排行.json
          if git diff --staged --quiet; then
            echo "No new data"
          else
            git commit -m "Tools: $(date '+%Y-%m-%d %H:%M')"
            if ! git pull --rebase --autostash origin main; then
              echo "::error::工具排行更新与 main 发生冲突，已停止推送，请人工合并"
              git rebase --abort || true
              exit 1
            fi
            git push
          fi
