# ============================================================
# 极光引擎 - GitHub Actions 每日自动部署配置
# 功能：每天自动采集最新AI资讯 → 提交更新 → 自动触发 Pages 部署
# ============================================================

name: "Aurora Engine - Daily AI News Update"

on:
  schedule:
    - cron: '0 0 * * *'       # UTC 0:00 = 北京时间 8:00
    - cron: '0 12 * * *'      # UTC 12:00 = 北京时间 20:00

  workflow_dispatch:

  push:
    branches:
      - main
      - master

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.11'
  TZ: 'Asia/Shanghai'

jobs:
  fetch-and-update:
    name: "Fetch AI News & Update"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser beautifulsoup4

      - name: Run fetch script
        run: |
          echo "================================================"
          echo " Aurora Engine - Daily AI News Fetch"
          echo " Time: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "================================================"
          python 自动采集AI资讯.py
          echo "Fetch completed"

      - name: Show stats
        run: |
          echo "===== Article Database Stats ====="
          python -c "
          import json
          with open('文章数据库.json', 'r', encoding='utf-8') as f:
              data = json.load(f)
          print(f'Total articles: {len(data)}')
          sources = {}
          cats = {}
          new_today = 0
          for a in data:
              s = a.get('来源', 'Unknown')
              c = a.get('分类', 'Unknown')
              sources[s] = sources.get(s, 0) + 1
              cats[c] = cats.get(c, 0) + 1
              if '2026-06-04' in str(a.get('日期', '')):
                  new_today += 1
          print(f'New today: {new_today}')
          print(f'Sources: {sources}')
          print(f'Categories: {cats}')
          print(f'Latest: {data[0][\"标题\"][:60] if data else \"None\"}')
          "

      - name: Commit and push changes
        run: |
          git config user.name "Aurora Bot"
          git config user.email "aurora-bot@users.noreply.github.com"
          git add 文章数据库.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto update: $(date '+%Y-%m-%d') - Latest AI news"
            git pull --rebase origin main
            git push
            echo "Changes committed and pushed - Pages will auto-deploy"
          fi
