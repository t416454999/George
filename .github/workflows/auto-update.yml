# ============================================================
# 极光引擎 - GitHub Actions 实时自动采集配置
# 功能：每30分钟自动采集、翻译和图片压缩，全部在 GitHub 云端运行
# ============================================================

name: "Aurora Engine - Real-time Content Update"

on:
  schedule:
    - cron: '*/30 * * * *'    # 每30分钟运行一次

  workflow_dispatch:

  push:
    branches:
      - main
      - master

permissions:
  contents: write

concurrency:
  group: aurora-cloud-content-update
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.11'
  TZ: 'Asia/Shanghai'

jobs:
  fetch-and-update:
    name: "Fetch AI News & Update"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Python依赖清单.txt

      - name: Run fetch script
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          # 标题翻译与杂志正文分别计数，正文不会耗尽人文标题配额。
          DEEPSEEK_TITLE_QUOTAS: '{"国际形势":8,"人文艺术":14,"情感":12,"世界杯":0}'
          DEEPSEEK_CATEGORY_QUOTAS: '{"国际形势":4,"人文艺术":4,"情感":4,"世界杯":0}'
          AURORA_CLOUD_RUNTIME: github-actions
        run: |
          echo "================================================"
          echo " Aurora Engine - Daily AI News Fetch"
          echo " Time: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "================================================"
          export AURORA_AGENT_NAME="自动采集脚本 (GitHub Actions)"
          export AURORA_OPERATOR="GitHub Actions Bot"
          python 自动采集AI资讯.py
          python 自动采集综合栏目.py
          python 生成首页精选.py
          echo "Fetch completed"

      - name: Show stats
        run: |
          echo "===== Article Database Stats ====="
          python -c "
          import json
          with open('文章数据库.json', 'r', encoding='utf-8') as f:
              data = json.load(f)
          print(f'Total articles: {len(data)}')
          sources = {}
          cats = {}
          new_today = 0
          for a in data:
              s = a.get('来源', 'Unknown')
              c = a.get('分类', 'Unknown')
              sources[s] = sources.get(s, 0) + 1
              cats[c] = cats.get(c, 0) + 1
              import datetime
              today_str = datetime.date.today().strftime('%Y-%m-%d')
              if today_str in str(a.get('日期', '')):
                  new_today += 1
          print(f'New today: {new_today}')
          print(f'Sources: {sources}')
          print(f'Categories: {cats}')
          print(f'Latest: {data[0][\"标题\"][:60] if data else \"None\"}')
          "

      - name: Commit and push changes
        run: |
          git config user.name "Aurora Bot"
          git config user.email "aurora-bot@users.noreply.github.com"
          # 不跟踪 修改登记.json（该文件由人工Agent维护，bot加入会导致rebase冲突）
          git add 文章数据库.json 国际形势.json 世界杯.json 人文艺术.json 情感.json 首页精选.json assets
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto update: $(date '+%Y-%m-%d') - Latest AI news"
            # 遇到冲突时自动使用远程版本（bot的数据总是最新的）
            git pull --rebase -X theirs origin main
            git push
            echo "Changes committed and pushed - Pages will auto-deploy"
          fi
